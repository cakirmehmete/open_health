# xcodegen spec for a personal device build WITH Oura's models on-device: project-ci.yml
# plus libtorch and the model families the app runs from notes/models/mobile. A model family with no file is
# skipped at run time (ModelFiles.swift), so the sleep stager alone still works. Needs:
#   notes/models/mobile/sleepstaging_2_6_0.ptl            (tools/export_mobile.py, torch 2.9.0)
#   notes/models/mobile/sleepstaging_2_6_0_classifier.bin
#   notes/models/mobile/<other models>.ptl                (optional, any version)
#   apps/ios/libtorch-xcframeworks/  (spike/build_libtorch_ios.sh [device] + package-libtorch-xcframeworks.sh)
# The models are Oura's and stay local (gitignored). Generate with:
#   xcodegen generate --spec project-torch.yml
name: OuraApp
options:
  bundleIdPrefix: com.cakirmehmete
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "42"
    PRODUCT_BUNDLE_IDENTIFIER: com.cakirmehmete.openoura
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only (no iPad multitasking orientation reqs)
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: OuraApp.entitlements
    DEVELOPMENT_TEAM: "A9GXNTCZM6"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  OuraApp:
    type: application
    platform: iOS
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-only (target-level, overrides xcodegen's 1,2 default)
        OTHER_LDFLAGS: [-lsqlite3]
        SWIFT_OBJC_BRIDGING_HEADER: TorchBridge.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: TORCH
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        SYSTEM_HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../../../local/libtorch-ios/pytorch/build_ios_device/install/include
          - $(SRCROOT)/../../../local/libtorch-ios/pytorch/build_ios_device/install/include/torch/csrc/api/include
        LD_RUNPATH_SEARCH_PATHS: [$(inherited), "@executable_path/Frameworks"]
    sources:
      - path: OuraApp.swift
      - path: Models.swift
      - path: Core.swift
      - path: WorkCoordinator.swift
      - path: Components.swift
      - path: Reports.swift
      - path: DayExport.swift
      - path: RawData.swift
      - path: ResearchExport.swift
      - path: HeartRate.swift
      - path: Theme.swift
      - path: BLETransport.swift
      - path: RingSync.swift
      - path: ProfileSettings.swift
      - path: EventStore.swift
      - path: ModelCache.swift
      - path: ModelProgress.swift
      - path: SleepStaging.swift
      - path: IbiCorrection.swift
      - path: NssaOps.c
        compilerFlags: [-ffp-contract=off]
      - path: NssaOps.h
      - path: CvaModel.swift
      - path: ActivityModel.swift
      - path: IllnessModel.swift
      - path: TorchBridge.mm
      - path: TorchBridge.h
      - path: CrashCatch.c
      - path: CrashCatch.h
      - path: Diagnostics.swift
      - path: HealthExport.swift
      - path: BackgroundSync.swift
      - path: RingWatcher.swift
      - path: StatusView.swift
      - path: ModelFiles.swift
      - path: InsightsView.swift
      - path: ../generated/oura_core.swift
      - path: Assets.xcassets
      # Models exported to notes/models/mobile (gitignored; Oura's files stay local).
      # Only the families the app runs (ModelFiles.known); it picks each family's
      # version at run time and skips a family with no file (tools/export_mobile.py).
      - path: ../../../notes/models/mobile
        type: group
        includes:
          - "sleepstaging_*"
          - "automatic_activity_detection_*.ptl"
          - "steps_motion_decoder_*.ptl"
          - "cva_[0-9]*.ptl"
          - "illness_detection_*.ptl"
        buildPhase: resources
    dependencies:
      - sdk: HealthKit.framework
      - framework: ../OuraCore.xcframework
        embed: false
      - framework: ../libtorch-xcframeworks/libtorch.xcframework
        embed: true
        codeSign: true
      - framework: ../libtorch-xcframeworks/libtorch_cpu.xcframework
        embed: true
        codeSign: true
      - framework: ../libtorch-xcframeworks/libc10.xcframework
        embed: true
        codeSign: true
      - framework: ../libtorch-xcframeworks/libtorch_global_deps.xcframework
        embed: true
        codeSign: true

  OuraAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OuraApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: TORCH

schemes:
  OuraApp:
    build:
      targets:
        OuraApp: all
    test:
      targets: [OuraAppTests]
